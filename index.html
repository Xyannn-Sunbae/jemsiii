<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galeri Foto</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="hero">
  <div><h1 id="judul"></h1><p id="desk"></p></div>
  <div class="strip" id="strip"></div>
</section>

<main>
  <div class="note" id="note" hidden>Ini tampilan contoh. Foto yang ditambahkan di sini hanya tampil di layar ini. Isi <b>CLOUD_NAME</b> dan <b>UPLOAD_PRESET</b> di script.js agar foto unggahan tersimpan dan terlihat oleh semua orang.</div>
  <div class="wall" id="wall"></div>
  <div id="more" style="height:1px"></div>
  <p class="empty" id="empty" hidden>Belum ada foto.</p>
</main>
<footer id="foot"></footer>

<input type="file" id="pick" accept="image/*" multiple hidden>
<button class="fab" id="fab" hidden>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Tambah foto
</button>
<div class="toast" id="toast" role="status"></div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Pratinjau foto">
  <img id="lbImg" alt="">
  <div class="row">
    <button id="prev" aria-label="Sebelumnya">‹</button>
    <span id="lbT"></span>
    <a id="lbDl" download>Unduh</a>
    <button id="lbDel" hidden>Hapus</button>
    <button id="next" aria-label="Berikutnya">›</button>
    <button id="x" aria-label="Tutup">✕</button>
  </div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
